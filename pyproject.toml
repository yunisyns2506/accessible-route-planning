[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "accessible-route-planning"
version = "0.1.0"
authors = [
  { name="Sabri Duruk", email="sabriduruk02@gmail.com" },
  { name="Yunis Teymurlu", email="yunisyns2506@gmail.com" }
]
description = "3DGS ve VR/Simülasyon Destekli Erişilebilir Rota Planlama Sistemi"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "trimesh>=4.0.0",
    "pillow-heif>=0.14.0",
    "rich>=13.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]
